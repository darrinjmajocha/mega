<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <title>Mega Toss</title>
  <link rel="stylesheet" href="./src/style.css?v=settings-9">
</head>
<body>
  <div id="particles" aria-hidden="true"></div>
  <aside class="settings" aria-label="Game settings">
    <button class="setting" id="volume" type="button" aria-label="Volume: 50%"><span class="setting-icon" aria-hidden="true"></span><span>Volume</span></button>
    <button class="setting" id="suspense" type="button" aria-pressed="false"><span class="setting-icon" aria-hidden="true"></span><span>Suspense Mode</span></button>
    <button class="setting" id="reduced" type="button" aria-pressed="false"><span class="setting-icon" aria-hidden="true"></span><span>Reduced Motion Mode</span></button>
  </aside>
  <div id="mode-notice" role="status" aria-live="polite" hidden></div>
  <main>
    <h1>Mega Toss</h1>
    <div class="stage"><div id="capsule" role="img" aria-label="Red and blue megavitamin"></div></div>
    <button id="toss" type="button">Toss</button>
  </main>
  <script type="module" src="./src/main.js?v=hold-12"></script>
</body>
</html>
